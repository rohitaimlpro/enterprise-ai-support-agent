services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_app_password}
      POSTGRES_DB: ${POSTGRES_DB:-support_agent}
    ports:
      # Host port 5433, not 5432 -- avoids clashing with a Postgres
      # instance that might already be running locally. The backend talks
      # to this over the internal Docker network as "postgres:5432"
      # regardless; this mapping is only for connecting from the host.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-support_app}:${POSTGRES_PASSWORD:-support_app_password}@postgres:5432/${POSTGRES_DB:-support_agent}
      REDIS_HOST: redis
      # Tells eval/run_eval.py (mounted below) where the backend package
      # root is inside this container -- see the comment in that file.
      BACKEND_DIR: /app
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - eval_results:/app/eval_results
      - ./eval:/app/eval:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # --- Optional observability stack. Start with:
  #   docker compose --profile monitoring up
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  chroma_data:
  eval_results:
